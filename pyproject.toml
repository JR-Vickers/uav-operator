[project]
name = "uav-operator"
description = "A multi-turn UAV operations environment where models manage drone missions under wind, airspace, and failure events."
tags = ["uav", "drone-operations", "multi-turn", "tool-use", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.6.1",
    "numpy",
    "pytest>=9.1.1",
    "verifiers>=0.1.15.dev189",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["uav_operator.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
