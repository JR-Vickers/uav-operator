model = "poolside/laguna-m.1"
provider = "prime"
api_client_type = "openai_chat_completions"

env_args = { tier = "T1", dataset_split = "dev", max_examples = 2, max_turns = 40 }
num_examples = 2
rollouts_per_example = 1
max_concurrent = 1
max_retries = 0
max_tokens = 512
temperature = 0.2
state_columns = ["sim_state", "sim_log"]
save_results = true
disable_tui = true
verbose = true

[[eval]]
id = "uav-operator"
